appId: com.yuki.ai
productName: Yuki AI
copyright: Copyright © 2026 void dekkeroid

# ── Build output ─────────────────────────────────────────────────────────────
directories:
  output: release
  buildResources: build

# ── Files to include in the Electron app ─────────────────────────────────────
files:
  - dist/**/*
  - '!dist/models/**/*'
  - main.electron.cjs
  - preload.cjs
  - icon.png

# ── Extra resources (copied next to the exe, not inside asar) ────────────────
extraResources:
  - from: ../backend/dist/backend
    to: backend
    filter:
      - "**/*"
  - from: ../backend/.env.default
    to: backend/.env
    filter:
      - "**/*"
  - from: ./dist
    to: frontend/dist
    filter:
      - "**/*"
      - '!models/**/*'
  - from: ./bundled-models
    to: models
    filter:
      - "**/*.vrm"
  - from: ./CREDITS.txt
    to: CREDITS.txt

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: dir
      arch:
        - x64
  icon: icon.ico

# ── macOS (for future) ──────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: icon.icns
  artifactName: "${productName}-${version}.${ext}"

# ── Linux (for future) ──────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: icon.png
  artifactName: "${productName}-${version}.${ext}"
